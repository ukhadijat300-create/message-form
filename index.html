<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesaage me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <form action="https://formspree.io/f/xqpaoeqp" method="POST">
        <!-- username -->
        <div class="head">
            <h3>MESSAGE ME </h3>
        </div>
        <div class="name">
            <label for="username">Enter your name</label><br>
            <input type="text" placeholder="username" id="username" name="username" required>
        </div>

        <!-- phone number -->
         <div class="phone-no">
            <label for="phone-no">Enter phone Number</label> <br>
            <input type="tel" name="phone-no" id="phone-no" placeholder="phone number" required>
         </div>


        <!-- user email -->
        <div class="email">
            <label for="Email">Enter your email</label><br>
            <input type="email" placeholder="email" id="email" name="email" required>
        </div>

        <!-- user message -->
        <div class="message">
            <textarea name="message" id="message" placeholder="enter message" rows="10" cols="23" required></textarea>
        </div>

        <div>
            <button type="submit">submit</button>
        </div>
    </form>

    <!-- notification message -->
    <div id="notification-container">
        <div class="container">
            <i id="close" class="fa-solid fa-x"></i>
            <p id="notification-message">Message sent successfully</p>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
